name: CI

# Upstream shipped this as `branches: [ $default-branch ]` — a template
# placeholder GitHub never substitutes, so the workflow matched nothing and had
# never run. Named explicitly here.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
      - run: npm ci
      # lint, format:check, build, then boot the server
      - run: npm test
